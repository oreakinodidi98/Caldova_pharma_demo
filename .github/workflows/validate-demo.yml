name: Validate Caldova legacy demo

on:
  push:
    paths:
      - 'caldova_Pharmaceuticals/**'
      - '.github/workflows/validate-demo.yml'
  pull_request:
    paths:
      - 'caldova_Pharmaceuticals/**'
      - '.github/workflows/validate-demo.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  functional:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: caldova_Pharmaceuticals
    steps:
      - uses: actions/checkout@v4
      - name: Select container Java version from pom.xml
        shell: pwsh
        run: |
          . ./scripts/common.ps1
          "CALDOVA_JAVA_VERSION=$env:CALDOVA_JAVA_VERSION" >> $env:GITHUB_ENV
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: caldova_Pharmaceuticals/browser-tests/package-lock.json
      - name: Verify project Java version against real Oracle
        shell: pwsh
        run: ./scripts/verify-demo.ps1
      - name: Verify reset preserves accounts and restores all records
        shell: pwsh
        run: |
          ./scripts/reset-demo.ps1 -ConfirmReset
          docker compose run --rm --no-deps verify mvn -B -ntp failsafe:integration-test failsafe:verify '-Dit.test=OracleDatasetIT,OraclePortalIT'
      - name: Start application
        run: docker compose up -d --build --wait --wait-timeout 180 app
      - name: Install browser validation dependencies
        working-directory: caldova_Pharmaceuticals/browser-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check browser flows
        working-directory: caldova_Pharmaceuticals/browser-tests
        run: npm test
      - name: Check real database outage and persistence
        shell: pwsh
        run: ./scripts/check-persistence.ps1
      - name: Store validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caldova-validation
          path: |
            caldova_Pharmaceuticals/target/surefire-reports/
            caldova_Pharmaceuticals/target/failsafe-reports/
            caldova_Pharmaceuticals/browser-tests/test-results/
      - name: Stop only this job's demo containers
        if: always()
        run: docker compose down
