name: Build and test

on:
  push:
    branches: [main]
    paths:
      - 'caldova_Pharmaceuticals/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'caldova_Pharmaceuticals/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read
# If a newer CI run starts for the same branch or PR, the older in-progress run is cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_DIRECTORY: caldova_Pharmaceuticals

    steps:
# Checks out the source code
      - name: Check out source
        uses: actions/checkout@v4
# Reads java.version from src/pom.xml (1.8 -> 8) so CI matches the Java version of the branch being built, including modernised branches
      - name: Detect Java version from pom.xml
        id: java
        run: |
          version=$(sed -n 's:.*<java.version>\(.*\)</java.version>.*:\1:p' "$APP_DIRECTORY/pom.xml" | head -n1)
          version="${version#1.}"
          echo "version=${version:-8}" >> "$GITHUB_OUTPUT"
          echo "Using Java ${version:-8}"
# Install the Temurin JDK detected from the pom
      - name: Set up Temurin ${{ steps.java.outputs.version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.version }}
          cache: maven
          cache-dependency-path: ${{ env.APP_DIRECTORY }}/pom.xml
      - name: Prepare Oracle and test credentials
        working-directory: ${{ env.APP_DIRECTORY }}
        shell: pwsh
        run: |
          ./scripts/setup-demo.ps1
          Add-Content -LiteralPath $env:GITHUB_ENV -Value 'SPRING_DATASOURCE_URL=jdbc:oracle:thin:@127.0.0.1:1521/FREEPDB1'
          Add-Content -LiteralPath $env:GITHUB_ENV -Value 'SPRING_DATASOURCE_USERNAME=CALDOVA_READ'
          Add-Content -LiteralPath $env:GITHUB_ENV -Value 'ORACLE_SETUP_USER=CALDOVA_OWNER'
          $credentials = @{
            CALDOVA_READ_PASSWORD = 'SPRING_DATASOURCE_PASSWORD'
            CALDOVA_OWNER_PASSWORD = 'ORACLE_SETUP_PASSWORD'
            PRESENTER_PASSWORD = 'PRESENTER_PASSWORD'
          }
          foreach ($key in $credentials.Keys) {
            $lines = @(Get-Content -LiteralPath '.env' | Where-Object { $_.StartsWith("$key=") })
            if ($lines.Count -ne 1 -or $lines[0].Length -le $key.Length + 1) {
              throw "Missing or duplicate test credential: $key"
            }
            $value = $lines[0].Substring($key.Length + 1)
            Write-Output "::add-mask::$value"
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "$($credentials[$key])=$value"
          }
# Maven command to compile the app, run tests, and perform any configured verification checks
      - name: Build and test
        working-directory: ${{ env.APP_DIRECTORY }}
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Store test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caldova-build-tests
          path: |
            ${{ env.APP_DIRECTORY }}/target/surefire-reports/
            ${{ env.APP_DIRECTORY }}/target/failsafe-reports/
      - name: Stop this job's database
        if: always()
        working-directory: ${{ env.APP_DIRECTORY }}
        run: docker compose down