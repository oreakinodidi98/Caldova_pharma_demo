name: Build and test

on:
  push:
    branches: [main]
    paths:
      - 'caldova_Pharmaceuticals/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'caldova_Pharmaceuticals/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read
# If a newer CI run starts for the same branch or PR, the older in-progress run is cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_DIRECTORY: caldova_Pharmaceuticals

    steps:
# Checks out the source code
      - name: Check out source
        uses: actions/checkout@v7
# Reads java.version from pom.xml (1.8 -> 8) so CI matches the Java version of the branch being built, including modernised branches
      - name: Detect Java version from pom.xml
        id: java
        run: |
          version=$(sed -n 's:.*<java.version>\(.*\)</java.version>.*:\1:p' "$APP_DIRECTORY/pom.xml" | head -n1)
          version="${version#1.}"
          echo "version=${version:-8}" >> "$GITHUB_OUTPUT"
          echo "Using Java ${version:-8}"
# Install the Temurin JDK detected from the pom
      - name: Set up Temurin ${{ steps.java.outputs.version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.version }}
          cache: maven
          cache-dependency-path: ${{ env.APP_DIRECTORY }}/pom.xml
      - name: Prepare Oracle database
        working-directory: ${{ env.APP_DIRECTORY }}
        shell: pwsh
        run: |
          . ./scripts/common.ps1
          Initialize-DemoEnvironment
          Invoke-Compose up -d --wait --wait-timeout 420 oracle
          Invoke-Compose exec -T oracle sh -c 'sqlplus -s / as sysdba @/opt/caldova/sql/setup.sql "$CALDOVA_OWNER_PASSWORD" "$CALDOVA_READ_PASSWORD"'
# Use the same test credentials as Compose, but connect through the host's IPv4 listener.
      - name: Build and test
        working-directory: ${{ env.APP_DIRECTORY }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $configJson = docker compose --profile tools config --format json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the demo test environment.' }
          $config = $configJson | ConvertFrom-Json
          foreach ($property in $config.services.verify.environment.PSObject.Properties) {
            if ($property.Name -like '*PASSWORD') {
              Write-Output "::add-mask::$($property.Value)"
            }
            [Environment]::SetEnvironmentVariable($property.Name, $property.Value, 'Process')
          }
          $env:SPRING_DATASOURCE_URL = 'jdbc:oracle:thin:@127.0.0.1:1521/FREEPDB1'
          mvn --batch-mode --no-transfer-progress compile exec:exec '-Dexec.executable=java' '-Dexec.args=-classpath %classpath com.caldova.production.setup.PresenterAccountSetup'
          if ($LASTEXITCODE -ne 0) { throw 'Presenter account setup failed.' }
          mvn --batch-mode --no-transfer-progress verify
          if ($LASTEXITCODE -ne 0) { throw 'Build and test failed.' }
      - name: Store test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caldova-build-test-reports
          path: |
            ${{ env.APP_DIRECTORY }}/target/surefire-reports/
            ${{ env.APP_DIRECTORY }}/target/failsafe-reports/
      - name: Stop only this job's demo containers
        if: always()
        working-directory: ${{ env.APP_DIRECTORY }}
        run: docker compose down